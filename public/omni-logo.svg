<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Border Gradient: Red to Orange to Gold -->
    <linearGradient id="squircleBorderGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="25%" stop-color="#FF2A3B" />
      <stop offset="50%" stop-color="#FF6100" />
      <stop offset="75%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FFBA00" />
    </linearGradient>

    <!-- Glyph Gradient: Exact Red to Orange to Yellow -->
    <linearGradient id="omegaGlyphGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF103F" />
      <stop offset="28%" stop-color="#FF2E36" />
      <stop offset="52%" stop-color="#FF6600" />
      <stop offset="78%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FFC200" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Squircle Outer Border (Continuous curvature rounded box) -->
  <rect
    x="66"
    y="66"
    width="380"
    height="380"
    rx="105"
    ry="105"
    fill="#000000"
    stroke="url(#squircleBorderGrad)"
    stroke-width="7"
  />

  <!-- Omega / Horseshoe Emblem with Inward Feet Tabs -->
  <!-- 
    Center of arch: (256, 238)
    Outer radius: 122
    Inner radius: 74
    Left leg: outer x=134, inner x=182. Bottom y=344. Inward tab goes to x=214, height 28 (from y=316 to 344).
    Right leg: inner x=330, outer x=378. Bottom y=344. Inward tab goes from x=298, height 28 (from y=316 to 344).
    Gap between tabs: 298 - 214 = 84px.
  -->
  <path
    d="
      M 134,238
      A 122,122 0 0,1 378,238
      L 378,344
      L 298,344
      L 298,316
      L 330,316
      L 330,238
      A 74,74 0 0,0 182,238
      L 182,316
      L 214,316
      L 214,344
      L 134,344
      Z
    "
    fill="url(#omegaGlyphGrad)"
  />
</svg>
