<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="50%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#140a10"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40"/>
      <stop offset="50%" stop-color="#e6194b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Radial Aura -->
  <circle cx="256" cy="256" r="160" fill="#e6194b" opacity="0.12" filter="blur(24px)"/>

  <!-- Main Omega Brand Glyph -->
  <g filter="url(#glow)">
    <path d="M 160 380 L 210 380 C 205 350, 185 330, 175 285 C 160 220, 195 140, 256 140 C 317 140, 352 220, 337 285 C 327 330, 307 350, 302 380 L 352 380 C 362 380, 368 390, 368 398 C 368 406, 362 412, 352 412 L 285 412 C 275 412, 268 404, 272 388 C 285 345, 302 310, 308 275 C 318 220, 296 178, 256 178 C 216 178, 194 220, 204 275 C 210 310, 227 345, 240 388 C 244 404, 237 412, 227 412 L 160 412 C 150 412, 144 406, 144 398 C 144 390, 150 380, 160 380 Z" fill="url(#brandGrad)"/>
  </g>

  <!-- OCU 77 Micro Monogram Tag -->
  <g transform="translate(256, 452)">
    <rect x="-56" y="-18" width="112" height="24" rx="6" fill="#181822" stroke="#e6194b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="0" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#fbbf24" letter-spacing="3" text-anchor="middle">OCU 77</text>
  </g>
</svg>
